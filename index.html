<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trumpet Studio Practice Tool</title>
    <link rel="stylesheet" href="styles.css?v=8">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-spacer"></div>
            <h1>Trumpet Studio Practice Tool</h1>
            <button id="leaderboardBtn" class="leaderboard-corner-btn">🏆</button>
        </header>

        <main>
            <div class="audio-section">
                <button id="playBtn" class="play-btn">Play Snippet</button>
                <div class="volume-control">
                    <label for="volumeSlider">Volume:</label>
                    <input type="range" id="volumeSlider" min="0" max="100" value="80">
                    <span id="volumeValue">80%</span>
                </div>
            </div>

            <div class="skip-section">
                <button id="skipBtn" class="skip-btn">Skip</button>
            </div>

            <div class="controls-row">
                <div class="mode-toggle">
                    <button id="modeToggle" class="mode-btn">Switch to Text Input</button>
                </div>

                <div class="category-selector">
                    <label for="categorySelect">Guess the:</label>
                    <select id="categorySelect" class="category-select">
                        <option value="title">Song Title</option>
                        <option value="performer">Performer</option>
                        <option value="composer">Composer</option>
                    </select>
                </div>
            </div>

            <div class="question-section">
                <h2 id="questionText">Which song is this?</h2>
                <div id="optionsContainer" class="options-container">
                    <!-- Options will be placed here -->
                </div>
                <div id="textInputContainer" class="text-input-container hidden">
                    <input type="text" id="answerInput" placeholder="Type the song name..." autocomplete="off">
                    <button id="submitBtn" class="submit-btn">Submit</button>
                </div>
            </div>

            <div id="feedback" class="feedback hidden">
                <div id="feedbackText"></div>
                <button id="nextBtn" class="next-btn hidden">Next Song</button>
            </div>
        </main>

        <footer>
            <div class="stats">
                <span class="streak">Streak: <span id="streakCount">0</span></span>
                <span class="correct">Correct: <span id="correctCount">0</span></span>
                <span class="wrong">Wrong: <span id="wrongCount">0</span></span>
            </div>
        </footer>
    </div>

    <div id="leaderboardModal" class="modal-overlay hidden">
        <div class="modal-pane">
            <div class="modal-header">
                <h2>Leaderboard</h2>
                <button id="closeLeaderboardBtn" class="close-btn">&times;</button>
            </div>
            <div class="modal-controls">
                <div class="modal-tabs">
                    <button class="tab-btn active" data-mode="multipleChoice">Multiple Choice</button>
                    <button class="tab-btn" data-mode="text">Text Input</button>
                </div>
                <select id="metricSelect" class="metric-select">
                    <option value="bestStreak">Best Streak</option>
                    <option value="correct">Most Correct</option>
                    <option value="winLossRatio">Win Rate</option>
                </select>
            </div>
            <div id="leaderboardContent" class="leaderboard-content">
                <p class="loading-text">Loading...</p>
            </div>
        </div>
    </div>

    <audio id="audioPlayer"></audio>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="data/songs.js?v=8"></script>
    <script src="app.js?v=8"></script>
</body>
</html>
